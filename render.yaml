services:
  - type: web
    name: wolke-assistent
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        generateValue: true
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_AUDIO_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_SPEECH_MODEL
        value: gemini-3.8-flash-tts
