<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f8f5"><title>Wolke</title><link rel="stylesheet" href="/login.css"><script type="module" src="/login.js"></script><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wolke"></head><body><div class="glow glow-one" aria-hidden="true"></div><div class="glow glow-two" aria-hidden="true"></div><main><select id="loginLanguage" aria-label="Sprache / Мова"><option value="uk">Українська</option><option value="de">Deutsch</option></select><div class="cloud"><img src="/logo.svg" width="84" height="84" alt=""></div><h1>Wolke</h1><p class="welcome">Твої ідеї. Твоя Wolke.</p><p class="subtitle">Твої чати — поруч на всіх пристроях.</p><button id="googleLogin" class="google-login" type="button" disabled><img src="/google.svg" width="22" height="22" alt="" aria-hidden="true"><span id="googleLabel">Увійти через Google</span><span class="spinner" aria-hidden="true"></span></button><p id="loginStatus" role="status">Готуємо вхід…</p><p id="cloudLoginError" role="alert" hidden></p><button id="retryLogin" class="retry" type="button" hidden>Спробувати ще раз</button><p class="remember">Увійди один раз — залишайся у своєму акаунті.</p></main></body></html>
